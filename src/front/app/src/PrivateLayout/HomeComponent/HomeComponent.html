<div class="flex min-h-full">
  <div class="flex grow flex-col gap-6">
    <section class="card-2 col-span-full">
      <div class="flex flex-col gap-6 lg:flex-row lg:items-center lg:justify-between">
        <div class="flex items-center gap-4">
          <a class="relative flex h-20 w-20 shrink-0 items-center justify-center overflow-hidden rounded-full"
            href="/my-profile">
            <img id="HomeAvatarImage" src="/default-avatar.webp" alt="User avatar"
              class="hidden h-full w-full object-cover object-center" width="160" height="160" />
            <span id="HomeAvatarInitial" class="text-3xl font-black">P</span>
          </a>

          <div class="min-w-0">
            <p class="subtitle-1">Home</p>
            <h1 id="HomeWelcomeTitle" class="title-1 wrap-break-word">Welcome back, Player</h1>
            <p class="subtitle-1 mt-2 text-sm">Jump back into the arena and keep your streak alive.</p>
          </div>
        </div>

        <div class="flex flex-col gap-4">
          <a class="btn btn-primary" href="/play">
            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" stroke-width="1.2" viewBox="0 0 640 640"
              stroke="currentColor" class="size-5">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M161 191L228.4 123.6C266.6 85.4 318.4 64 372.4 64C484.9 64 576.1 155.2 576.1 267.6C576.1 314 560.3 358.7 531.6 394.6C508 377.8 479.2 367.9 448.1 367.9C417 367.9 388.2 377.8 364.7 394.5L161 191zM304 512C304 521.7 305 531.1 306.8 540.2C287 535 268.8 524.7 254.1 510C241.9 497.8 222.2 497.8 210 510L160.6 559.4C150 570 135.6 576 120.6 576C89.4 576 64 550.7 64 519.4C64 504.4 70 490 80.6 479.4L130 430C142.2 417.8 142.2 398.1 130 385.9C108.3 364.2 96.1 334.7 96.1 304C96.1 274.6 107.2 246.4 127.2 225L330.6 428.6C313.9 452.1 304 480.9 304 512zM448 416C501 416 544 459 544 512C544 565 501 608 448 608C395 608 352 565 352 512C352 459 395 416 448 416z" />
            </svg>
            Play a match
          </a>
          <a class="btn btn-primary" href="/play/tournaments">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5">
              <path fill-rule="evenodd"
                d="M5.166 2.621v.858c-1.035.148-2.059.33-3.071.543a.75.75 0 0 0-.584.859 6.753 6.753 0 0 0 6.138 5.6 6.73 6.73 0 0 0 2.743 1.346A6.707 6.707 0 0 1 9.279 15H8.54c-1.036 0-1.875.84-1.875 1.875V19.5h-.75a2.25 2.25 0 0 0-2.25 2.25c0 .414.336.75.75.75h15a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-2.25-2.25h-.75v-2.625c0-1.036-.84-1.875-1.875-1.875h-.739a6.706 6.706 0 0 1-1.112-3.173 6.73 6.73 0 0 0 2.743-1.347 6.753 6.753 0 0 0 6.139-5.6.75.75 0 0 0-.585-.858 47.077 47.077 0 0 0-3.07-.543V2.62a.75.75 0 0 0-.658-.744 49.22 49.22 0 0 0-6.093-.377c-2.063 0-4.096.128-6.093.377a.75.75 0 0 0-.657.744Zm0 2.629c0 1.196.312 2.32.857 3.294A5.266 5.266 0 0 1 3.16 5.337a45.6 45.6 0 0 1 2.006-.343v.256Zm13.5 0v-.256c.674.1 1.343.214 2.006.343a5.265 5.265 0 0 1-2.863 3.207 6.72 6.72 0 0 0 .857-3.294Z"
                clip-rule="evenodd" />
            </svg>

            Play a tournament
          </a>
        </div>
      </div>
    </section>

    <section class="grow grid grid-cols-1 gap-6 lg:grid-cols-3">
      <article class="card-2 lg:col-span-2">
        <div class="mb-4 flex items-center justify-between gap-3">
          <h2 class="title-2">Recent Activity</h2>
          <span class="text-xs uppercase tracking-[0.24em]">Latest 10</span>
        </div>

        <div id="HomeRecentActivity" class="overflow-hidden rounded-2xl border border-gray-700">
          <p class="subtitle-3 py-4 text-center">Loading activity...</p>
        </div>
      </article>

      <aside class="card-2">
        <div class="flex flex-col gap-5">
          <div>
            <h2 class="title-2">Quick Stats</h2>
            <p class="mt-2 text-sm">Your last 10 matches at a glance.</p>
          </div>

          <div class="rounded-2xl border border-gray-700 p-5">
            <p class="text-xs font-semibold uppercase tracking-[0.24em]">Winrate</p>
            <p id="HomeQuickStatsWinrate" class="mt-2 text-5xl font-black tracking-tight">--%</p>
          </div>

          <div class="rounded-2xl border border-gray-700 p-5">
            <p class="text-xs font-semibold uppercase tracking-[0.24em]">Recent matches played</p>
            <p id="HomeQuickStatsTotal" class="mt-2 text-4xl font-bold">0</p>
            <p id="HomeQuickStatsSummary" class="mt-1 text-sm">Loading recent match data...</p>
          </div>
        </div>
      </aside>
    </section>
  </div>
</div>
